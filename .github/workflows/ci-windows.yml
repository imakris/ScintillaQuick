name: CI Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows / Qt 6.10.1 / shared=${{ matrix.build-shared }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build-shared: [OFF, ON]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.build-shared }}
          -DBUILD_TESTING=ON
          -DSCINTILLAQUICK_BUILD_EXAMPLES=ON
          -DSCINTILLAQUICK_BUILD_BENCHMARKS=ON
          -DSCINTILLAQUICK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Add built DLL directory to PATH (shared)
        if: matrix.build-shared == 'ON'
        shell: pwsh
        run: |
          "$PWD/build/Release" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # tests/CMakeLists.txt pins QT_QPA_PLATFORM, QT_FONT_DPI,
      # QT_SCALE_FACTOR and QT_ENABLE_HIGHDPI_SCALING per test as a CTest
      # ENVIRONMENT property, which overrides anything inherited from
      # here. On Windows that selects the native windows platform plugin,
      # which is the rasteriser the visual baselines were captured under.
      - name: Run tests
        working-directory: build
        run: >
          ctest -C Release --output-on-failure
          -E "scintillaquick_embedded_benchmark"

      # The visual baselines are a DirectWrite/GDI oracle, so they are
      # only valid while the runner keeps rasterising glyphs the same
      # way. Record the settings they depend on from every run, green or
      # red: diagnosing a future break means diffing a passing run's
      # environment against a failing one's.
      - name: Report the rendering environment the baselines depend on
        if: always()
        shell: pwsh
        run: |
          $desktop = Get-ItemProperty 'HKCU:\Control Panel\Desktop'
          "FontSmoothing       : $($desktop.FontSmoothing)"
          "FontSmoothingType   : $($desktop.FontSmoothingType)"
          "FontSmoothingGamma  : $($desktop.FontSmoothingGamma)"
          "FontSmoothingOrient : $($desktop.FontSmoothingOrientation)"
          $os = Get-CimInstance Win32_OperatingSystem
          "OS                  : $($os.Caption) $($os.Version)"
          "Image version       : $env:ImageVersion"
          $gpu = Get-CimInstance Win32_VideoController | Select-Object -First 1
          "Screen              : $($gpu.CurrentHorizontalResolution)x$($gpu.CurrentVerticalResolution)"

      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts-shared-${{ matrix.build-shared }}
          path: build/tests/visual_regression_artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Install & test downstream consumer
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/build/_install"
          mkdir -p build/_consumer
          cat > build/_consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(scintillaquick_consumer_smoke LANGUAGES CXX)
          find_package(ScintillaQuick CONFIG REQUIRED)
          add_executable(consumer_smoke consumer.cpp)
          target_link_libraries(consumer_smoke PRIVATE ScintillaQuick::ScintillaQuick)
          EOF
          cat > build/_consumer/consumer.cpp <<'EOF'
          #include <scintillaquick/scintillaquick_item.h>
          int main() { return scintillaquick::version_major >= 0 ? 0 : 1; }
          EOF
          cmake -S build/_consumer -B build/_consumer/_build \
            -DCMAKE_PREFIX_PATH="$PWD/build/_install"
          cmake --build build/_consumer/_build --config Release
          export PATH="$PWD/build/_install/bin:$PATH"
          ./build/_consumer/_build/Release/consumer_smoke.exe
